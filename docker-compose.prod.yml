# ==============================================================================
# Production Docker Compose for Bessel
# ==============================================================================
# Deployed to VPS, accessible only via Tailscale.
# Uses shared Traefik reverse proxy (from Nous stack) with IP allowlist
# restricting access to Tailscale CGNAT range.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f
#
# Prerequisites:
#   - Create .env with required variables (see .env.example)
#   - Traefik running on the `web` network (from Nous stack)
#   - Tailscale running on host
# ==============================================================================

x-db-env: &db_env
  BESSEL_POSTGRES_USER: ${BESSEL_POSTGRES_USER}
  BESSEL_POSTGRES_PASSWORD: ${BESSEL_POSTGRES_PASSWORD}
  BESSEL_POSTGRES_DB: ${BESSEL_POSTGRES_DB}
  BESSEL_POSTGRES_PORT: 5432
  BESSEL_POSTGRES_HOST: bessel-postgres

x-redis-env: &redis_env
  BESSEL_REDIS_HOST: bessel-redis
  BESSEL_REDIS_PORT: 6379

services:
  # ============================================================================
  # Database
  # ============================================================================
  bessel-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BESSEL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BESSEL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${BESSEL_POSTGRES_DB}
    volumes:
      - bessel_postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "log_min_duration_statement=1000"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d ${BESSEL_POSTGRES_DB} -U ${BESSEL_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bessel-internal

  # ============================================================================
  # Cache & Job Queue
  # ============================================================================
  bessel-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - bessel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bessel-internal

  # ============================================================================
  # API
  # ============================================================================
  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-simonri/bessel}-api:${TAG:-latest}
    restart: unless-stopped
    # Longer than uvicorn's --timeout-graceful-shutdown, so lifespan shutdown runs.
    stop_grace_period: 20s
    depends_on:
      bessel-postgres:
        condition: service_healthy
      bessel-redis:
        condition: service_healthy
    environment:
      <<: [*db_env, *redis_env]
      BESSEL_ENV: production
      BESSEL_RELEASE: ${TAG:-}
      BESSEL_LOG_LEVEL: INFO
      BESSEL_CORS_ORIGINS: ${BESSEL_CORS_ORIGINS}
      BESSEL_FRONTEND_BASE_URL: ${BESSEL_FRONTEND_BASE_URL:-https://app.getbessel.com}
      BESSEL_AUTH0_DOMAIN: ${BESSEL_AUTH0_DOMAIN}
      BESSEL_AUTH0_AUDIENCE: ${BESSEL_AUTH0_AUDIENCE}
      BESSEL_GOOGLE_PLACES_API_KEY: ${BESSEL_GOOGLE_PLACES_API_KEY:-}
      BESSEL_API_BASE_URL: ${BESSEL_API_BASE_URL:-https://api.getbessel.com}
      BESSEL_MCP_RESOURCE_URL: ${BESSEL_MCP_RESOURCE_URL:-https://api.getbessel.com/mcp}
      BESSEL_CREDENTIALS_ENCRYPTION_KEY: ${BESSEL_CREDENTIALS_ENCRYPTION_KEY:-}
      BESSEL_GOOGLE_OAUTH_CLIENT_ID: ${BESSEL_GOOGLE_OAUTH_CLIENT_ID:-}
      BESSEL_GOOGLE_OAUTH_CLIENT_SECRET: ${BESSEL_GOOGLE_OAUTH_CLIENT_SECRET:-}
      BESSEL_OPENROUTER_API_KEY: ${BESSEL_OPENROUTER_API_KEY:-}
      BESSEL_ENABLE_BANKING_APP_ID: ${BESSEL_ENABLE_BANKING_APP_ID:-}
      BESSEL_ENABLE_BANKING_PRIVATE_KEY: ${BESSEL_ENABLE_BANKING_PRIVATE_KEY:-}
      # JSON list of user ids allowed to connect a bank, e.g. ["3a6a1c3c-..."].
      BESSEL_ENABLE_BANKING_USER_IDS: ${BESSEL_ENABLE_BANKING_USER_IDS:-[]}
      # JSON list of user ids allowed to store an Avanza login.
      BESSEL_AVANZA_USER_IDS: ${BESSEL_AVANZA_USER_IDS:-[]}
      BESSEL_SENTRY_DSN: ${BESSEL_SENTRY_DSN:-}
      # Uploaded files (task images, invoices) live in Cloudflare R2; without these, uploads are refused.
      BESSEL_STORAGE_ENDPOINT_URL: ${BESSEL_STORAGE_ENDPOINT_URL:-}
      BESSEL_STORAGE_BUCKET: ${BESSEL_STORAGE_BUCKET:-}
      BESSEL_STORAGE_ACCESS_KEY_ID: ${BESSEL_STORAGE_ACCESS_KEY_ID:-}
      BESSEL_STORAGE_SECRET_ACCESS_KEY: ${BESSEL_STORAGE_SECRET_ACCESS_KEY:-}
      # Memory search by meaning runs on this server; the model is fetched once into the volume below.
      BESSEL_MEMORY_EMBEDDING_MODEL: ${BESSEL_MEMORY_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-mpnet-base-v2}
      BESSEL_MEMORY_EMBEDDING_CACHE_DIR: /models
    volumes:
      - bessel_models:/models
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # API routes (Tailscale-only). Legacy: kept until desktop installs that
      # still point at the tailnet host have updated to api.getbessel.com.
      - "traefik.http.routers.bessel-api-tailnet.rule=Host(`vps.tailca3fd9.ts.net`) && (PathPrefix(`/v1`) || Path(`/healthz`) || Path(`/openapi.json`))"
      - "traefik.http.routers.bessel-api-tailnet.entrypoints=websecure"
      - "traefik.http.routers.bessel-api-tailnet.middlewares=bessel-tailscale@docker"
      - "traefik.http.services.bessel-api.loadbalancer.server.port=8000"
      # Tailscale-only access
      - "traefik.http.middlewares.bessel-tailscale.ipallowlist.sourcerange=100.64.0.0/10"
      # Public API access (api.getbessel.com, app.getbessel.com/v1) - both reach
      # Traefik through the Cloudflare Tunnel in /home/infra/cloudflared. Separate
      # cert resolver since the default DNS-01 Cloudflare token on this box isn't
      # scoped to this zone
      # `/mcp` is the remote MCP server Claude connects to; the well-known path is its OAuth protected resource metadata.
      - "traefik.http.routers.bessel-api-public.rule=Host(`api.getbessel.com`) && (PathPrefix(`/v1`) || Path(`/healthz`) || Path(`/openapi.json`) || Path(`/mcp`) || Path(`/.well-known/oauth-protected-resource/mcp`) || Path(`/favicon.ico`))"
      - "traefik.http.routers.bessel-api-public.entrypoints=websecure"
      - "traefik.http.routers.bessel-api-public.tls.certresolver=letsencrypt-http"
      - "traefik.http.routers.bessel-api-public.service=bessel-api"
      - "traefik.http.routers.bessel-api-public.middlewares=security-headers@file,rate-limit@file"
      # The web app calls the API on its own origin (VITE_API_BASE_URL=/)
      - "traefik.http.routers.bessel-app-api.rule=Host(`app.getbessel.com`) && (PathPrefix(`/v1`) || Path(`/healthz`) || Path(`/openapi.json`))"
      - "traefik.http.routers.bessel-app-api.entrypoints=websecure"
      - "traefik.http.routers.bessel-app-api.tls.certresolver=letsencrypt-http"
      - "traefik.http.routers.bessel-app-api.service=bessel-api"
      - "traefik.http.routers.bessel-app-api.middlewares=rate-limit@file"
    networks:
      - bessel-internal
      - web

  # ============================================================================
  # Background Worker
  # ============================================================================
  worker:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-simonri/bessel}-api:${TAG:-latest}
    command: ["dramatiq", "-p", "1", "-t", "1", "--queues", "high_priority", "medium_priority", "low_priority", "-f", "api.worker.scheduler:start", "api.worker.run"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "dramatiq"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
    depends_on:
      bessel-postgres:
        condition: service_healthy
      bessel-redis:
        condition: service_healthy
    environment:
      <<: [*db_env, *redis_env]
      BESSEL_ENV: production
      BESSEL_LOG_LEVEL: INFO
      BESSEL_AUTH0_DOMAIN: ${BESSEL_AUTH0_DOMAIN}
      BESSEL_AUTH0_AUDIENCE: ${BESSEL_AUTH0_AUDIENCE}
      # Google calendar change notifications are addressed to this API.
      BESSEL_API_BASE_URL: ${BESSEL_API_BASE_URL:-https://api.getbessel.com}
      BESSEL_CREDENTIALS_ENCRYPTION_KEY: ${BESSEL_CREDENTIALS_ENCRYPTION_KEY:-}
      BESSEL_GOOGLE_OAUTH_CLIENT_ID: ${BESSEL_GOOGLE_OAUTH_CLIENT_ID:-}
      BESSEL_GOOGLE_OAUTH_CLIENT_SECRET: ${BESSEL_GOOGLE_OAUTH_CLIENT_SECRET:-}
      # The twice-daily bank sync runs here.
      BESSEL_ENABLE_BANKING_APP_ID: ${BESSEL_ENABLE_BANKING_APP_ID:-}
      BESSEL_ENABLE_BANKING_PRIVATE_KEY: ${BESSEL_ENABLE_BANKING_PRIVATE_KEY:-}
      BESSEL_SENTRY_DSN: ${BESSEL_SENTRY_DSN:-}
      # Uploaded files (task images, invoices) live in Cloudflare R2; without these, uploads are refused.
      BESSEL_STORAGE_ENDPOINT_URL: ${BESSEL_STORAGE_ENDPOINT_URL:-}
      BESSEL_STORAGE_BUCKET: ${BESSEL_STORAGE_BUCKET:-}
      BESSEL_STORAGE_ACCESS_KEY_ID: ${BESSEL_STORAGE_ACCESS_KEY_ID:-}
      BESSEL_STORAGE_SECRET_ACCESS_KEY: ${BESSEL_STORAGE_SECRET_ACCESS_KEY:-}
    networks:
      - bessel-internal

  # ============================================================================
  # Web Frontend
  # ============================================================================
  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_PREFIX:-simonri/bessel}-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.bessel-web-tailnet.rule=Host(`vps.tailca3fd9.ts.net`)"
      - "traefik.http.routers.bessel-web-tailnet.entrypoints=websecure"
      - "traefik.http.routers.bessel-web-tailnet.middlewares=bessel-tailscale@docker"
      - "traefik.http.routers.bessel-web-tailnet.priority=1"
      - "traefik.http.routers.bessel-web-public.rule=Host(`app.getbessel.com`)"
      - "traefik.http.routers.bessel-web-public.entrypoints=websecure"
      - "traefik.http.routers.bessel-web-public.tls.certresolver=letsencrypt-http"
      - "traefik.http.routers.bessel-web-public.service=bessel-web"
      - "traefik.http.routers.bessel-web-public.priority=1"
      - "traefik.http.services.bessel-web.loadbalancer.server.port=3000"
    networks:
      - bessel-internal
      - web

# The volumes were created under the old project-scoped names; pinning them keeps the same data.
volumes:
  bessel_postgres_data:
    name: metron_metron_postgres_data
  bessel_redis_data:
    name: metron_metron_redis_data
  bessel_models:
    name: metron_metron_models

networks:
  bessel-internal:
    driver: bridge
  web:
    external: true
