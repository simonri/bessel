# ==============================================================================
# Pull request checks
# ==============================================================================
# What a pull request must pass before it lands (scripts/land.sh waits for it):
# the parts of the monorepo it changed are linted, typed and tested, the API
# contract holds, and there is a single Alembic head. Runs on every pull
# request so there is always a check to wait for; jobs skip what didn't change.
# ==============================================================================

name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'pyproject.toml'
              - 'uv.lock'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'biome.json'
            desktop:
              - 'apps/desktop/**'
              - 'pnpm-lock.yaml'
            contract:
              - 'services/api/**'
              - 'packages/client/**'
              - 'apps/ios/Bessel/API/Generated/**'
              - 'scripts/generate_clients.sh'
              - 'scripts/generate_swift_models.py'
              - 'scripts/check_clients.sh'
              - 'scripts/check_api_compat.sh'

  api:
    name: API
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bessel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BESSEL_POSTGRES_HOST: localhost
      BESSEL_POSTGRES_PORT: 5432
      BESSEL_POSTGRES_USER: postgres
      BESSEL_POSTGRES_PASSWORD: postgres
      BESSEL_POSTGRES_DB: bessel
      BESSEL_REDIS_HOST: localhost
      BESSEL_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: One Alembic head
        run: test "$(uv run alembic heads | grep -c .)" -eq 1 || { uv run alembic heads; echo "::error::More than one Alembic head."; exit 1; }
      - run: uv run task test

  web:
    name: Web
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - name: Biome on the changed files
        run: node_modules/.bin/biome ci --changed --since=${{ github.event.pull_request.base.sha }} --no-errors-on-unmatched
      - name: Types
        working-directory: apps/web
        run: node_modules/.bin/tsc --noEmit
      - name: Tests
        run: pnpm --filter @bessel/web test

  desktop:
    name: Desktop
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - name: Types
        working-directory: apps/desktop
        run: node_modules/.bin/tsc --noEmit
      - name: Tests
        run: pnpm --filter @bessel/desktop test

  contract:
    name: API Contract
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-pnpm
      - run: uv sync --frozen
      - run: scripts/check_clients.sh
      - name: No breaking API changes
        run: scripts/check_api_compat.sh "${{ github.event.pull_request.base.sha }}"
