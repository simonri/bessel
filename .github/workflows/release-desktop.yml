name: Release Desktop

# A v* tag builds the Linux AppImage and releases it from the same job: the
# release is created as a draft with its files, then published, so the updater
# never sees a half-finished one. Run it by hand for a dry run that publishes
# nothing. The Mac and Windows builds are paused; they were matrix entries here
# up to 2d06f1c.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Compile
        run: pnpm run compile
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
          VITE_FRONTEND_URL: app://localhost

      - name: Package
        run: pnpm exec electron-builder --linux --publish never --config electron-builder.config.ts

      - name: Check node-pty in the packaged app
        run: ELECTRON_RUN_AS_NODE=1 release/linux-unpacked/bessel scripts/smoke-pty.cjs release/linux-unpacked/resources

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" release/Bessel-linux-x86_64.AppImage release/latest-linux.yml \
            --repo "$GITHUB_REPOSITORY" --draft --title "${GITHUB_REF_NAME#v}" --notes ""
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
