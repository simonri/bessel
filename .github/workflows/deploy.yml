# ==============================================================================
# Production Deployment — Bessel
# ==============================================================================
# Builds Docker images and deploys to VPS on push to main.
# Only builds/deploys services whose code has changed.
# Deploys are pinned to the commit SHA — rollback by re-running the workflow
# from an older commit (workflow_dispatch).
# Co-exists with Nous on the same VPS (separate compose project).
#
# Required Secrets:
#   - VPS_HOST, VPS_USER, VPS_SSH_KEY
# ==============================================================================

name: Deploy

on:
  push:
    branches: [master]
    paths:
      - "services/**"
      - "apps/web/**"
      - "packages/**"
      - "docker-compose.prod.yml"
      - "run.sh"
      - ".github/workflows/deploy.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (all, api, worker, web)"
        required: false
        default: "all"

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/bessel

jobs:
  # ============================================================================
  # Detect changes
  # ============================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.set-outputs.outputs.api }}
      worker: ${{ steps.set-outputs.outputs.worker }}
      web: ${{ steps.set-outputs.outputs.web }}
      contract: ${{ steps.changes.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        if: github.event_name != 'workflow_dispatch'
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'pyproject.toml'
              - 'uv.lock'
            worker:
              - 'services/api/**'
              - 'pyproject.toml'
              - 'uv.lock'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/client/**'
              - 'packages/tsconfig/**'
              - 'pnpm-lock.yaml'
            contract:
              - 'scripts/generate_clients.sh'
              - 'scripts/generate_swift_models.py'
              - 'scripts/check_clients.sh'
              - 'scripts/check_api_compat.sh'
              - '.github/workflows/deploy.yml'

      - name: Set outputs
        id: set-outputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICE="${{ github.event.inputs.service }}"
            case "$SERVICE" in
              api)    echo "api=true"  >> $GITHUB_OUTPUT; echo "worker=false" >> $GITHUB_OUTPUT; echo "web=false" >> $GITHUB_OUTPUT ;;
              worker) echo "api=false" >> $GITHUB_OUTPUT; echo "worker=true"  >> $GITHUB_OUTPUT; echo "web=false" >> $GITHUB_OUTPUT ;;
              web)    echo "api=false" >> $GITHUB_OUTPUT; echo "worker=false" >> $GITHUB_OUTPUT; echo "web=true"  >> $GITHUB_OUTPUT ;;
              *)      echo "api=true"  >> $GITHUB_OUTPUT; echo "worker=true"  >> $GITHUB_OUTPUT; echo "web=true"  >> $GITHUB_OUTPUT ;;
            esac
          else
            echo "api=${{ steps.changes.outputs.api }}"       >> $GITHUB_OUTPUT
            echo "worker=${{ steps.changes.outputs.worker }}" >> $GITHUB_OUTPUT
            echo "web=${{ steps.changes.outputs.web }}"       >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # Test & Lint (gates the deploy; runs alongside the builds)
  # ============================================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    # Only the API has tests here; a web-only change doesn't wait on them.
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.worker == 'true'
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bessel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BESSEL_POSTGRES_HOST: localhost
      BESSEL_POSTGRES_PORT: 5432
      BESSEL_POSTGRES_USER: postgres
      BESSEL_POSTGRES_PASSWORD: postgres
      BESSEL_POSTGRES_DB: bessel
      BESSEL_REDIS_HOST: localhost
      BESSEL_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run task test

  # ============================================================================
  # API contract: the committed spec and TypeScript client match the API's code
  # ============================================================================
  contract:
    name: API Contract
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.worker == 'true' || needs.detect-changes.outputs.web == 'true' || needs.detect-changes.outputs.contract == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-pnpm
      - run: uv sync --frozen
      - run: scripts/check_clients.sh
      # Against the spec before this push; a manual deploy (often a rollback) has nothing to compare with.
      - name: No breaking API changes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: scripts/check_api_compat.sh "${{ github.event.before }}"

  # ============================================================================
  # Build API (also used by the worker service)
  # ============================================================================
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.worker == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          # `latest` moves only after a healthy deploy (see the deploy job).
          tags: |
            type=sha,prefix=,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================================================
  # Build Web
  # ============================================================================
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pnpm

      - run: pnpm --filter web build
        env:
          VITE_API_BASE_URL: /
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          # `latest` moves only after a healthy deploy (see the deploy job).
          tags: |
            type=sha,prefix=,format=long
      - uses: docker/build-push-action@v6
        with:
          context: apps/web/dist/client
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # ============================================================================
  # Deploy to VPS
  # ============================================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [detect-changes, test, contract, build-api, build-web]
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.contract.result == 'success' || needs.contract.result == 'skipped') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.worker == 'true' || needs.detect-changes.outputs.web == 'true')
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy deploy files to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,run.sh"
          target: "/home/metron/"

      - name: Deploy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          TAG: ${{ github.sha }}
          DEPLOY_API: ${{ needs.detect-changes.outputs.api }}
          DEPLOY_WORKER: ${{ needs.detect-changes.outputs.worker }}
          DEPLOY_WEB: ${{ needs.detect-changes.outputs.web }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REGISTRY,IMAGE_PREFIX,TAG,DEPLOY_API,DEPLOY_WORKER,DEPLOY_WEB
          script: |
            set -e
            cd /home/metron
            chmod +x run.sh

            DC="/home/metron/run.sh docker compose -f docker-compose.prod.yml"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            SERVICES=""
            [ "$DEPLOY_API" = "true" ]    && SERVICES="$SERVICES api"
            [ "$DEPLOY_WORKER" = "true" ] && SERVICES="$SERVICES worker"
            [ "$DEPLOY_WEB" = "true" ]    && SERVICES="$SERVICES web"

            echo "Deploying $TAG:$SERVICES"

            $DC pull $SERVICES

            # Run migrations if API changed
            if [ "$DEPLOY_API" = "true" ]; then
              $DC run --rm api python db.py upgrade
            fi

            $DC up -d --no-deps --wait $SERVICES

            $DC ps

            docker image prune -af \
              --filter "until=168h" \
              --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"

            echo "Deploy complete ($TAG):$SERVICES"

      - name: Verify
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            DC="/home/metron/run.sh docker compose -f docker-compose.prod.yml"
            unhealthy=$($DC ps --format json | jq -r 'select(.Health != "healthy" and .Health != "") | .Service')
            if [ -n "$unhealthy" ]; then
              echo "Unhealthy: $unhealthy"
              $DC logs --tail=50 $unhealthy
              exit 1
            fi
            echo "All services healthy"

      - name: Point latest at the deployed images
        env:
          TAG: ${{ github.sha }}
          DEPLOY_API: ${{ needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.worker == 'true' }}
          DEPLOY_WEB: ${{ needs.detect-changes.outputs.web }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          for service in api web; do
            deploy_var="DEPLOY_${service^^}"
            [ "${!deploy_var}" = "true" ] || continue
            image="${REGISTRY}/${IMAGE_PREFIX}-${service}"
            docker buildx imagetools create --tag "$image:latest" "$image:$TAG"
          done
