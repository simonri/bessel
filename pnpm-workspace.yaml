packages:
  - packages/*
  - apps/*

allowBuilds:
  browser-tabs-lock: true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  node-pty: true
  sharp: true
  workerd: true

# dbus-next only uses usocket as an optional accelerator. Its native ArrayBuffer
# allocation is incompatible with Electron's V8 sandbox; Node's built-in Unix
# socket implementation is portable and fully supports the session bus here.
ignoredOptionalDependencies:
  - usocket

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5

overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
  react: '19.3.1'
  react-dom: '19.3.1'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@1.3.0'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.3.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.3.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.3.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0'
  - vite-plus@1.3.0
