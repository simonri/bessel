name: Bessel
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Config/Dev.xcconfig
  Release: Config/Prod.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: WQH84QWCFP
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
targets:
  Bessel:
    type: application
    platform: iOS
    sources:
      - Bessel
    scheme:
      gatherCoverageData: false
      testTargets:
        - BesselTests
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: Bessel/Bessel.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Bessel/Info.plist
      properties:
        CFBundleDisplayName: $(BESSEL_APP_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: Bessel reads your workouts, sleep, steps, active energy and heart rate from Health to show how you're doing each day and sync it to your account.
        NSBluetoothAlwaysUsageDescription: Bessel connects to the golf cart's battery monitor over Bluetooth to show live battery status.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(PRODUCT_BUNDLE_IDENTIFIER)
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).health-sync
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        AUTH_CALLBACK_SCHEME: $(PRODUCT_BUNDLE_IDENTIFIER)
        API_BASE_URL: $(API_BASE_URL)
        AUTH0_DOMAIN: $(AUTH0_DOMAIN)
        AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
        AUTH0_AUDIENCE: $(AUTH0_AUDIENCE)
  BesselTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BesselTests
    dependencies:
      - target: Bessel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
